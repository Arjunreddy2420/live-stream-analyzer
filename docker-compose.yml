version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stream_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/stream_analyzer
    depends_on:
      - postgres

  # Local RTMP/SRT test source. Push a stream into it with ffmpeg or OBS (see
  # README "Testing with a local stream"), then point the analyzer's source_url
  # at rtmp://localhost:1935/live/test or srt://localhost:8890?streamid=publish:test
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935" # RTMP
      - "8890:8890/udp" # SRT

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
